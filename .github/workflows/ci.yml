name: AIRA Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Pytest Suite & Migration Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Backend Pytest Suite
        env:
          FLASK_ENV: testing
          JWT_SECRET_KEY: test-ci-jwt-secret-key-that-is-at-least-32-chars
          SECRET_KEY: test-ci-flask-secret-key-at-least-32-chars-long
          SUPABASE_URL: https://mock.supabase.co
          SUPABASE_ANON_KEY: mock-key
          GEMINI_API_KEY: mock-gemini-key
        run: |
          python -m pytest -v

  frontend-test:
    name: Frontend Typecheck, Vitest & E2E Suite
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Strict TypeScript Compilation Check
        run: npm run typecheck

      - name: Run Vitest Unit & Integration Suite
        run: npm run test

      - name: Production Bundle Build
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright Browser E2E Tests
        run: npm run test:e2e

  production-docker-validation:
    name: Production Container & Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Backend Docker Image
        run: docker build . -t aira-backend:ci-test

      - name: Build Frontend Docker Image
        run: docker build frontend/ -t aira-frontend:ci-test
