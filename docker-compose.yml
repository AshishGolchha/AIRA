# ==============================================================================
# AIRA Production-Like Local Orchestration (Docker Compose)
# Reproducible stack: Nginx Frontend -> Gunicorn Flask Backend -> Supabase PostgreSQL
# ==============================================================================

services:
  # 1. Production WSGI Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aira-backend
    restart: unless-stopped
    environment:
      FLASK_ENV: production
      DATABASE_URL: ${DATABASE_URL:-}
      SECRET_KEY: ${SECRET_KEY:-production-flask-secret-key-min-32-chars-long!}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-production-jwt-secret-key-min-32-chars-length!}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:8080,http://127.0.0.1:8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Supabase Relational & Vector Storage Configuration
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      # Google Gemini AI Configuration
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_LLM_MODEL: ${GEMINI_LLM_MODEL:-gemini/gemini-3.6-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      # Rate Limiting & Security Configuration
      RATELIMIT_ENABLED: ${RATELIMIT_ENABLED:-true}
      SECURITY_HEADERS_ENABLED: ${SECURITY_HEADERS_ENABLED:-true}
    networks:
      - aira-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 2. Static Nginx Web Server & Reverse Proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aira-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aira-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  aira-network:
    driver: bridge
