<!doctype html>
<html lang="en" class="light scroll-smooth" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Page Metadata -->
    <title>AIRA — Autonomous Investment Research Agent | AI Portfolio Intelligence</title>
    <meta name="title" content="AIRA — Autonomous Investment Research Agent | AI Portfolio Intelligence" />
    <meta name="description" content="AIRA is an autonomous investment research and portfolio intelligence platform combining multi-agent company research, real-time portfolio valuation, deterministic risk alerts, and persistent semantic memory." />

    <meta name="author" content="AIRA Systems" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#F8FAFC" />

    <!-- Early Theme Initializer to eliminate flash of wrong theme -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('aira_theme') || 'light';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://aira.internal/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aira.internal/" />
    <meta property="og:title" content="AIRA — Autonomous Investment Research Agent" />
