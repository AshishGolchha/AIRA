<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#090B10"/>
  
  <!-- Subtle Gradients -->
  <circle cx="200" cy="150" r="300" fill="#4F46E5" fill-opacity="0.12" filter="blur(80px)"/>
  <circle cx="1000" cy="450" r="300" fill="#06B6D4" fill-opacity="0.12" filter="blur(80px)"/>
  
  <!-- Grid overlay -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Card Border -->
  <rect x="80" y="80" width="1040" height="470" rx="24" stroke="rgba(255,255,255,0.12)" fill="rgba(18,22,31,0.6)" stroke-width="2"/>
  
  <!-- New Precision Lens Mark -->
  <g transform="translate(140, 140)">
    <defs>
      <linearGradient id="og-lens" x1="0" y1="32" x2="64" y2="32" gradientUnits="userSpaceOnUse">
        <stop offset="0%"   stop-color="#3730A3"/>
        <stop offset="55%"  stop-color="#4F46E5"/>
        <stop offset="100%" stop-color="#6366F1"/>
      </linearGradient>
    </defs>
    <!-- Scan line -->
    <line x1="2"  y1="32" x2="16" y2="32" stroke="#4F46E5" stroke-width="1.6" stroke-linecap="round" opacity="0.65"/>
    <line x1="2"  y1="28.5" x2="2" y2="35.5" stroke="#4F46E5" stroke-width="1.6" stroke-linecap="round" opacity="0.65"/>
    <!-- Upper lens arc -->
    <path d="M 18 32 Q 32 10 46 32" stroke="url(#og-lens)" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <!-- Lower lens arc -->
    <path d="M 46 32 Q 32 54 18 32" stroke="url(#og-lens)" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <!-- Focus ring -->
    <circle cx="32" cy="32" r="8.5" stroke="#6366F1" stroke-width="1.2" fill="none" opacity="0.45"/>
    <!-- Center gold dot -->
    <circle cx="32" cy="32" r="4" fill="#D97706"/>
    <circle cx="30.8" cy="30.8" r="1.4" fill="#FCD34D" opacity="0.55"/>
  </g>
  
  <!-- Title & Typography -->
  <text x="225" y="185" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.02em">AIRA</text>
  <text x="330" y="185" fill="#818CF8" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" letter-spacing="0.05em">AUTONOMOUS INVESTMENT RESEARCH &amp; ANALYSIS</text>
  
  <text x="140" y="290" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="800" letter-spacing="-0.03em">Your Investment Research,</text>
  <text x="140" y="350" fill="#06B6D4" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="800" letter-spacing="-0.03em">Running on Autonomous Intelligence.</text>
  
  <text x="140" y="420" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" letter-spacing="-0.01em">Multi-agent financial synthesis, real-time portfolio weights, and deterministic telemetry.</text>
  
  <!-- Capability Pills -->
  <g transform="translate(140, 465)">
    <rect width="180" height="38" rx="19" fill="#1E2430" stroke="rgba(255,255,255,0.1)"/>
    <text x="24" y="24" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500">AI Company Research</text>
    
    <rect x="195" width="180" height="38" rx="19" fill="#1E2430" stroke="rgba(255,255,255,0.1)"/>
    <text x="219" y="24" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500">Portfolio Intelligence</text>
    
    <rect x="390" width="180" height="38" rx="19" fill="#1E2430" stroke="rgba(255,255,255,0.1)"/>
    <text x="414" y="24" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500">Deterministic Alerts</text>
    
    <rect x="585" width="180" height="38" rx="19" fill="#1E2430" stroke="rgba(255,255,255,0.1)"/>
    <text x="609" y="24" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500">Vector Memory (pgvector)</text>
  </g>
</svg>
